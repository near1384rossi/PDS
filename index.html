<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 다이어리</title>
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="다이어리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#FBF8F3;--line:#C9A77F;--ink:#2B241E;--mute:#6B5E52;--card:#F3EEE6;--blue:#2F6FEB;--tabh:72px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--mute);font-size:13px}
/* 레이아웃 */
.page{padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
.split{display:grid;grid-template-columns:1fr;min-height:calc(100vh - var(--tabh))}
.pane{min-width:0;padding:0 16px 24px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 12px;border-bottom:2px dashed var(--line);margin-bottom:12px;flex-wrap:wrap}
.hdr h1{margin:0;font-size:26px;letter-spacing:-.5px}
.hdr .count{font-size:14px;color:var(--mute);font-weight:500;margin-left:8px}
.acts{display:flex;align-items:center;gap:8px}
.pill{height:36px;padding:0 14px;border:1px solid #D9CDBE;border-radius:999px;background:#fff;font-size:14px;font-weight:500}
.icon-btn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center}
.back{display:none}
@media(min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split>.pane+.pane{border-left:1px solid #E7DED2;background:#FCFAF6}
  .split.one{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:899px){
  .split.detail>.pane:first-child{display:none}
  .split:not(.detail)>.pane+.pane{display:none}
  .back{display:flex}
}
.sec{margin:18px 4px 8px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:13px;color:#2457C5;font-weight:500}
.empty{margin:4px 4px 12px;color:var(--mute);font-size:14px}
/* 하단 폴더 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 8px env(safe-area-inset-bottom);align-items:end}
.tab{position:relative;height:56px;border:0;border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:#3A2E25;transition:height .15s}
.tab::after{content:"";position:absolute;inset:5px 5px 0;border:1.5px dashed rgba(90,60,30,.35);border-bottom:0;border-radius:12px 12px 0 0;pointer-events:none}
.tab[aria-current=page]{height:68px;font-weight:700;font-size:13px;box-shadow:0 -2px 8px rgba(80,50,20,.12)}
.tab svg{width:22px;height:22px}
.t-cal{background:#F8D3CE}.t-cal[aria-current=page]{background:#EE8A7E}
.t-todo{background:#FADDC2}.t-todo[aria-current=page]{background:#F2A964}
.t-memo{background:#F8EBBB}.t-memo[aria-current=page]{background:#EDCB5A}
.t-rec{background:#DDEDCB}.t-rec[aria-current=page]{background:#A6D07D}
.t-set{background:#CFE4F1}.t-set[aria-current=page]{background:#7DB9DE}
.fab{position:fixed;right:20px;bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:#DCE6FF;color:#1F4FB8;box-shadow:0 6px 16px rgba(40,60,120,.22);display:flex;align-items:center;justify-content:center;z-index:9}
@media(min-width:900px){.fab{right:calc(50% + 20px)}.fab.full{right:20px}}
/* 월간 달력 */
.mh,.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh span{text-align:center;font-size:13px;font-weight:500;padding:4px 0 8px}
.mg{border-top:1px solid #DCCDB9}
.cell{min-height:92px;border:0;border-right:1px solid #E6DACA;border-bottom:1px solid #DCCDB9;background:transparent;padding:6px 3px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell .num{font-size:14px;text-align:center;line-height:26px;height:26px}
.cell.sel{background:#EEF0F7}
.cell.today .num{width:28px;margin:0 auto;border-radius:50%;box-shadow:0 0 0 2px #D9534F inset;font-weight:700}
.cell.out .num{opacity:.45}
.chip{font-size:11px;line-height:1.35;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#F4DE9C;color:#3A2E25}
.chip.work{background:#D6E3FB;color:#1F3F8A}.chip.site{background:#F9D9B5;color:#6B3A00}.chip.life{background:#E6DDF9;color:#45308C}
.tdot{font-size:10px;color:var(--mute);padding-left:4px}
@media(min-width:900px){.cell{min-height:110px}}
/* 리스트 공통 */
.item{display:flex;align-items:center;gap:6px;border-bottom:1px solid #EDE5DA}
.chk{flex:1;display:flex;align-items:center;gap:14px;min-height:60px;border:0;background:transparent;text-align:left;padding:6px 4px;min-width:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #8FB2E8;flex:none;display:flex;align-items:center;justify-content:center;background:#fff}
.item.done .box{background:var(--blue);border-color:var(--blue)}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt b{font-size:17px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.txt span{font-size:13px;color:var(--mute)}
.txt span.due{color:#B3261E}
.item.done .txt b{color:#7A6F64;text-decoration:line-through}
.star{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#B9AFA4}
.star[aria-pressed=true]{color:#E5A800}
.prog{display:flex;justify-content:space-between;font-size:16px;margin:4px 4px 6px}
.prog b{color:#2457C5;font-weight:500;font-size:14px}
.pbar{height:4px;border-radius:999px;background:#E6DDF5;margin:0 4px 14px}.pbar i{display:block;height:4px;border-radius:999px;background:#9C7BEA;transition:width .2s}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 4px 6px}
.fchip{height:40px;min-width:52px;padding:0 16px;border:1px solid #D9CDBE;border-radius:12px;background:#fff;font-size:15px;font-weight:500}
.fchip[aria-pressed=true]{background:#E9F5DE;border:1.5px dashed #E39A5A;font-weight:700}
.add{display:flex;gap:8px;margin:12px 4px}
.add input{flex:1;min-width:0;height:46px;border:1px solid #D9CDBE;border-radius:12px;padding:0 12px;font-size:16px;background:#fff}
.btn{height:46px;min-width:46px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;padding:0 14px;display:flex;align-items:center;justify-content:center}
.ghost{height:44px;border:1px dashed #BCA98F;border-radius:12px;background:transparent;font-size:14px;font-weight:500;padding:0 14px}
.msg{margin:4px;font-size:13px;color:#1F4FB8}
/* 일정 */
.ev{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#fff;margin:0 4px 8px;border:1px solid #EFE7DC}
.ev .tm{width:56px;font-size:14px;font-weight:700;display:flex;flex-direction:column}
.ev .tm span{font-size:11px;color:var(--mute);font-weight:400}
.ev i{width:8px;height:8px;border-radius:50%;flex:none}
.evform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 4px}
.evform input{height:44px;border:1px solid #D9CDBE;border-radius:12px;padding:0 10px;font-size:16px;background:#fff;min-width:0}
.evform .full{grid-column:1/-1}
/* 기록 (PDS) */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 12px}
.day{border:0;border-radius:14px;background:transparent;padding:6px 0;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .w{font-size:11px;color:var(--mute)}.day .n{font-size:17px;font-weight:500}
.day[aria-pressed=true]{background:#A6D07D}.day[aria-pressed=true] .w{color:#2B241E}.day[aria-pressed=true] .n{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 4px 12px}
.stat{background:#fff;border:1px solid #EFE7DC;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;color:var(--mute)}.stat b{font-size:17px}
.tl-h,.row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:6px}
.tl-h{font-size:12px;font-weight:700;color:var(--mute);margin:0 4px 4px}
.tl{position:relative;margin:0 4px}
.row{height:32px;border-top:1px solid #EDE5DA}
.row .hr{font-size:11px;color:var(--mute);padding-top:2px}
.do{margin:2px 0;border:1px dashed #DCCDB9;border-radius:6px;background:transparent;font-size:11px;font-weight:500;text-align:left;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.do.on{border:0;background:#CFE8B8;color:#2E4F14}
.plan{position:absolute;left:50px;width:calc((100% - 62px)/2);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:500;overflow:hidden;display:flex;flex-direction:column}
.plan b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.see label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;margin:0 4px 12px}
textarea.f{border:1px solid #D9CDBE;border-radius:12px;padding:10px 12px;font-size:16px;resize:vertical;min-height:72px;background:#fff}
.mini{display:flex;gap:4px;padding:3px;border-radius:10px;background:#EFE7DC}
.mini button{height:34px;padding:0 12px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.mini button[aria-pressed=true]{background:#fff;font-weight:700}
/* 메모 */
.mcard{display:flex;flex-direction:column;gap:6px;width:100%;border:0;background:#EFEAE3;border-radius:16px;padding:14px 16px;text-align:left;margin-bottom:10px}
.mcard[aria-current=true]{background:#FBEFC7;box-shadow:0 0 0 2px #EDCB5A inset}
.mcard b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard p{margin:0;font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard span{font-size:13px;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0 4px}
.mgrid .mcard{margin:0}
.mtitle{border:0;border-bottom:1px solid #E7DED2;font-size:22px;font-weight:700;padding:6px 2px 10px;background:transparent;width:100%}
.mtitle:focus{outline:none;border-bottom-color:var(--blue)}
.mtext{min-height:440px;width:100%}
/* 손글씨 */
.pad{display:flex;flex-direction:column;gap:8px}
.ptools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pt{height:40px;min-width:40px;border:1px solid #DCCDB9;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;font-size:13px;font-weight:500}
.pt[aria-pressed=true]{background:#2B241E;color:#fff;border-color:#2B241E}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #D9CDBE;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px #2B241E}
.sep{width:1px;height:28px;background:#DCCDB9;margin:0 2px}
.pcanvas{position:relative;border:1px solid #DCCDB9;border-radius:14px;overflow:hidden;background-color:#FFFDF8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#EFE7DC 35px,#EFE7DC 36px)}
.pcanvas canvas{display:block;width:100%;touch-action:none}
.qtool{position:absolute;top:10px;right:10px;width:52px;height:52px;border-radius:16px;border:1px solid #DCCDB9;background:#fff;color:#2B241E;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,40,20,.15)}
.qtool.er{background:#FBE3E0;border-color:#E8A49B;color:#9B2C20}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(43,36,30,.85);color:#fff;font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.ptools label{display:flex;align-items:center;gap:6px;font-size:13px;min-height:40px}
.ptools input[type=range]{width:90px}
.phint{font-size:12px;color:var(--mute);margin:0}
/* 설정 */
.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;border:0;background:transparent;text-align:left;padding:0 6px;font-size:17px}
.srow[aria-current=true]{background:#F1E9DD;border-radius:12px}
.srow .fold{width:30px;height:24px;border-radius:4px 4px 5px 5px;flex:none;position:relative}
.srow .fold::before{content:"";position:absolute;left:0;top:-4px;width:12px;height:6px;border-radius:3px 3px 0 0;background:inherit}
.srow .chev{margin-left:auto;color:var(--mute)}
.sgrp{margin:0 4px 6px;padding:10px 0;border-bottom:2px dashed var(--line)}
.sgrp h3{display:inline-block;margin:6px 0 8px;font-size:16px;background:linear-gradient(transparent 60%,#F9D3CC 60%);padding:0 2px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.opt div{display:flex;flex-direction:column;gap:2px}
.opt b{font-size:16px;font-weight:500}.opt span{font-size:13px;color:var(--mute)}
.sw2{width:52px;height:32px;border-radius:999px;border:0;background:#DCD4C9;position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw2[aria-checked=true]{background:#EE8A9E}.sw2[aria-checked=true]::after{left:23px}
.opt select{height:40px;border:1px solid #D9CDBE;border-radius:10px;background:#fff;padding:0 10px;font-size:15px}
.syncchip{cursor:pointer;font-size:12px;font-weight:500;padding:5px 10px;border-radius:999px;background:#EAF1FE;color:#1F4FB8;white-space:nowrap}
.syncchip[data-st=local],.syncchip[data-st=offline]{background:#F1E9DD;color:#6B5E52}
.syncchip[data-st=error],.syncchip[data-st=toolarge]{background:#FBE3E0;color:#9B2C20}
.note{font-size:12px;color:var(--mute);text-align:center;margin:20px 0 0}
</style>
</head>
<body>
<div class="page">

<!-- ========== 캘린더 ========== -->
<section id="v-cal" class="split">
  <div class="pane">
    <div class="hdr">
      <div style="display:flex;align-items:center;gap:2px"><button type="button" class="icon-btn" id="prevM" aria-label="이전 달"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 id="calTitle" style="color:#8A5A2E"></h1><button type="button" class="icon-btn" id="nextM" aria-label="다음 달"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
      <div class="acts"><span class="syncchip" role="status"></span><button type="button" class="pill" id="goToday">오늘</button></div>
    </div>
    <div class="mh"><span style="color:#C0392B">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span style="color:#2457C5">토</span></div>
    <div class="mg" id="mg"></div>
  </div>
  <div class="pane" id="dayPane">
    <div class="hdr">
      <div style="display:flex;align-items:center;gap:6px">
        <button type="button" class="icon-btn back" data-back="cal" aria-label="달력으로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
        <h1 id="dayTitle" style="font-size:22px"></h1>
      </div>
    </div>
    <div class="sec">일정<small id="evCnt"></small></div>
    <div id="dayEvents"></div>
    <form class="evform hide" id="evForm">
      <label class="sr" for="evT">일정 제목</label><input id="evT" class="full" placeholder="일정 제목" required>
      <label class="sr" for="evS">시작</label><input id="evS" type="time" value="10:00">
      <label class="sr" for="evE">종료</label><input id="evE" type="time" value="11:00">
      <label class="sr" for="evC">분류</label><select id="evC" class="full" style="height:44px;border:1px solid #D9CDBE;border-radius:12px;padding:0 10px;font-size:16px;background:#fff"><option value="work">업무</option><option value="site">현장 · 미팅</option><option value="life">개인 · 가족</option></select>
      <button type="submit" class="btn full">일정 추가</button>
    </form>
    <div class="sec">할 일<small id="dayTodoCnt"></small></div>
    <div id="dayTodos"></div>
    <form class="add" data-add="day">
      <label class="sr" for="dayAdd">이 날 할 일 추가</label>
      <input id="dayAdd" placeholder="이 날 할 일 추가" autocomplete="off">
      <button class="btn" type="submit" aria-label="추가"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div style="margin:16px 4px"><button type="button" class="ghost" data-gorec>이 날 실행 기록 · 회고 쓰기 →</button></div>
  </div>
</section>

<!-- ========== 할 일 ========== -->
<section id="v-todo" class="split one hide">
  <div class="pane" style="max-width:820px;width:100%;margin:0 auto">
    <div class="hdr"><h1>할 일</h1><span class="syncchip" role="status"></span></div>
    <div class="prog"><span id="tProg"></span><b id="tPct"></b></div>
    <div class="pbar"><i id="tBar"></i></div>
    <div class="chips" role="group" aria-label="보기">
      <button type="button" class="fchip" data-filter="star" aria-label="중요"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F2B705" stroke="#C99400" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></button>
      <button type="button" class="fchip" data-filter="all">전체</button>
      <button type="button" class="fchip" data-filter="today">오늘</button>
      <button type="button" class="fchip" data-filter="tomorrow">내일</button>
      <button type="button" class="fchip" data-filter="done">완료</button>
    </div>
    <div class="sec" id="tSec"></div>
    <div id="tList"></div>
    <form class="add" data-add="todo">
      <label class="sr" for="todoAdd">할 일 추가</label>
      <input id="todoAdd" placeholder="오늘 할 일 추가" autocomplete="off">
      <label class="sr" for="todoRep">반복</label><select id="todoRep" style="height:46px;border:1px solid #D9CDBE;border-radius:12px;padding:0 8px;font-size:15px;background:#fff"><option value="">한 번</option><option value="daily">매일</option></select>
      <button class="btn" type="submit" aria-label="추가"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div style="margin:4px"><button type="button" class="ghost" id="carry">오늘 미완료 할 일 내일로 넘기기</button><p class="msg hide" id="msg"></p></div>
  </div>
</section>

<!-- ========== 메모 ========== -->
<section id="v-memo" class="split hide">
  <div class="pane">

<script>
(function(){
  var ROW=32, START=6, END=24, P='mycal-';
  var WD=['일','월','화','수','목','금','토'];
  var COL={work:['#DCE7FD','#1F4FB8','#2F6FEB'],site:['#FBE3C7','#7A4200','#E07B00'],life:['#ECE6FC','#4A2F9A','#7C5CE0']};
  function pad(n){return(n<10?'0':'')+n}
  function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
  function wdOf(s){return WD[pd(s).getDay()]}
  function md(s){var d=pd(s);return(d.getMonth()+1)+'월 '+d.getDate()+'일'}
  function full(s){var d=pd(s);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wdOf(s)+')'}
  var TODAY=ds(new Date());

  function load(k,d){try{var v=localStorage.getItem(P+k);return v?JSON.parse(v):d}catch(e){return d}}
  function rawSave(k,v){try{localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}}
  function save(k,v){rawSave(k,v);if(typeof onLocalSave==='function')onLocalSave(k)}
  var settings=load('settings',{startTab:'cal',gcal:true,gtasks:true,doCal:true,palm:true});
  var S={
    tab:null, sel:TODAY, ym:null, filter:'today', nextId:load('nextId',1),
    userEv:load('userEv',{}), todos:load('todos',[]), doLog:load('doLog',{}),
    see:load('see',{}), seeInk:load('seeInk',{}), seeMode:load('seeMode','type'),
    memos:load('memos',[{id:1,title:'사용법',text:'· 아래 탭을 한 번 더 누르면 그 탭의 첫 화면(오늘)으로 돌아갑니다.\n· 손글씨: 펜슬 끝으로 같은 자리를 빠르게 두 번 톡톡 치면 펜 ↔ 지우개가 바뀝니다.\n· 설정 → 백업에서 백업 파일을 저장해 두세요.',strokes:[],mode:'type',updated:Date.now()}]),
    cur:null, detail:{cal:false,memo:false,set:false}, setSel:'sync'
  };
  (function(){var d=new Date();S.ym={y:d.getFullYear(),m:d.getMonth()}})();
  function $(id){return document.getElementById(id)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(x){var h=Math.floor(x),m=Math.round((x-h)*60);return pad(h)+':'+pad(m)}
  function evOf(s){
    var a=(S.userEv[s]||[]).map(function(x,i){return{s:x[0],e:x[1],t:x[2],cat:x[3],src:'local',i:i}});
    var g=(typeof G!=='undefined'&&G.ev[s])?G.ev[s].filter(function(e){return settings.gcalShow?settings.gcalShow[e.calId]!==false:true}):[];
    return a.concat(g).sort(function(x,y){return((y.allDay?1:0)-(x.allDay?1:0))||(x.s-y.s)});
  }
  function hexA(h,a){h=(h||'#2F6FEB').replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');var n=parseInt(h,16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
  function evStyle(e){if(e.src==='local'){var c=COL[e.cat]||COL.work;return{bg:c[0],fg:c[1],dot:c[2]}}return{bg:hexA(e.color,.25),fg:'#2B241E',dot:e.color||'#2F6FEB'}}
  function wide(){return window.matchMedia('(min-width:900px)').matches}
  var ICON_CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var ICON_STAR='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>';
  var ICON_X='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

  /* ---------- 손글씨 패드 (애플펜슬 필압 + 두 번 톡톡 지우개) ---------- */
  function makePad(host,height,getStrokes,onChange){
    var tool='pen',color='#2B241E',size=3,fingerOK=true,penSeen=false;
    var colors=['#2B241E','#1F4FB8','#C0392B','#2E7D4F'];
    host.innerHTML='<div class="pad"><div class="ptools">'+
      '<button type="button" class="pt" data-t="pen" aria-pressed="true">펜</button>'+
      '<button type="button" class="pt" data-t="hl" aria-pressed="false">형광펜</button>'+
      '<button type="button" class="pt" data-t="er" aria-pressed="false">지우개</button><span class="sep"></span>'+
      colors.map(function(c,i){return '<button type="button" class="sw" data-c="'+c+'" style="background:'+c+'" aria-label="색 '+(i+1)+'" aria-pressed="'+(i===0)+'"></button>'}).join('')+
      '<span class="sep"></span><label>굵기<input type="range" min="1" max="10" value="3" data-size></label>'+
      '<button type="button" class="pt" data-undo aria-label="실행 취소"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>'+
      '<button type="button" class="pt" data-clear>전체 지우기</button>'+
      '<button type="button" class="pt" data-finger aria-pressed="true">손가락 쓰기</button>'+
      '</div><div class="pcanvas"><canvas style="height:'+height+'px" aria-label="손글씨 입력 영역"></canvas>'+
      '<button type="button" class="qtool" data-quick aria-label="펜과 지우개 전환"></button><span class="toast" aria-live="polite"></span></div>'+
      '<p class="phint">펜슬 끝으로 같은 자리를 <b>빠르게 두 번 톡톡</b> 치거나 오른쪽 위 버튼을 누르면 펜 ↔ 지우개가 바뀝니다. 애플펜슬을 쓰면 손가락 쓰기는 자동으로 꺼집니다.</p></div>';
    var cv=host.querySelector('canvas'),ctx=cv.getContext('2d'),cur=null,dpr=1,lastTap=null,downAt=0,prevTool='pen';
    var ICON_PEN='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    var ICON_ER='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7M5 11l9 9"/></svg>';
    function setTool(t,announce){
      if(t!=='er')prevTool=t;tool=t;
      host.querySelectorAll('[data-t]').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.t===t)});
      var q=host.querySelector('[data-quick]');q.innerHTML=t==='er'?ICON_ER:ICON_PEN;q.classList.toggle('er',t==='er');
      if(announce){var ts=host.querySelector('.toast');ts.textContent=t==='er'?'지우개':(t==='hl'?'형광펜':'펜');ts.classList.add('on');clearTimeout(ts._t);ts._t=setTimeout(function(){ts.classList.remove('on')},900)}
    }
    function toggleEraser(){setTool(tool==='er'?prevTool:'er',true)}
    function resize(){var w=cv.clientWidth;if(!w)return;dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(height*dpr);redraw()}
    function drawStroke(s){
      var p=s.p;if(!p.length)return;
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.c;
      if(s.h){ctx.globalAlpha=.35;ctx.lineWidth=s.w*4;ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);if(p.length===1)ctx.lineTo(p[0][0]+.1,p[0][1]);ctx.stroke()}
      else{for(var j=0;j<p.length;j++){var a=p[j>0?j-1:0],b=p[j];ctx.lineWidth=s.w*(.35+b[2]*1.3);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0]+(j?0:.1),b[1]);ctx.stroke()}}
      ctx.restore();
    }
    function redraw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);getStrokes().forEach(drawStroke)}
    function pos(e){var r=cv.getBoundingClientRect(),pr=e.pressure;if(e.pointerType!=='pen'||!pr)pr=.5;return[Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10,Math.round(pr*100)/100]}
    function allowed(e){if(e.pointerType==='pen'){if(!penSeen){penSeen=true;if(settings.palm){fingerOK=false;setBtn()}}return true}return fingerOK}
    function eraseAt(pt){var st=getStrokes(),r=12,ch=false;for(var i=st.length-1;i>=0;i--){if(st[i].p.some(function(q){return Math.abs(q[0]-pt[0])<r&&Math.abs(q[1]-pt[1])<r})){st.splice(i,1);ch=true}}if(ch)redraw()}
    cv.addEventListener('pointerdown',function(e){
      if(!allowed(e))return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
      var pt=pos(e);downAt=Date.now();
      if(tool==='er'){cur={er:true,s:pt,m:0,pen:e.pointerType==='pen'};eraseAt(pt);return}
      cur={c:tool==='hl'?'#F5C518':color,w:size,h:tool==='hl',p:[pt],pen:e.pointerType==='pen'};getStrokes().push(cur);drawStroke(cur);
    });
    cv.addEventListener('pointermove',function(e){
      if(!cur)return;e.preventDefault();
      var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
      evs.forEach(function(ev){var pt=pos(ev);if(cur.er){cur.m=Math.max(cur.m,Math.abs(pt[0]-cur.s[0])+Math.abs(pt[1]-cur.s[1]));eraseAt(pt)}else cur.p.push(pt)});
      if(!cur.er)redraw();
    });
    function end(){
      if(!cur)return;var c=cur;cur=null;
      var dur=Date.now()-downAt,small,at;
      if(c.er){small=c.m<8;at=c.s}else{var xs=c.p.map(function(q){return q[0]}),ys=c.p.map(function(q){return q[1]});
        small=(Math.max.apply(null,xs)-Math.min.apply(null,xs))<8&&(Math.max.apply(null,ys)-Math.min.apply(null,ys))<8;at=c.p[0]}
      if(c.pen&&small&&dur<250){
        var now=Date.now();
        if(lastTap&&now-lastTap.t<450&&Math.abs(lastTap.at[0]-at[0])<40&&Math.abs(lastTap.at[1]-at[1])<40){
          var st=getStrokes();[lastTap.s,c.er?null:c].forEach(function(x){var i=x?st.indexOf(x):-1;if(i>=0)st.splice(i,1)});
          lastTap=null;redraw();toggleEraser();onChange();return;
        }
        lastTap={t:now,at:at,s:c.er?null:c};
      }else lastTap=null;
      onChange();
    }
    cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
    cv.addEventListener('touchmove',function(e){if(cur)e.preventDefault()},{passive:false});
    function setBtn(){host.querySelector('[data-finger]').setAttribute('aria-pressed',fingerOK)}
    host.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b||!host.contains(b))return;
      if(b.dataset.t){setTool(b.dataset.t)}
      else if(b.hasAttribute('data-quick')){toggleEraser()}
      else if(b.dataset.c){color=b.dataset.c;setTool('pen');host.querySelectorAll('[data-c]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}
      else if(b.hasAttribute('data-undo')){getStrokes().pop();redraw();onChange()}
      else if(b.hasAttribute('data-clear')){var s=getStrokes();s.splice(0,s.length);redraw();onChange()}
      else if(b.hasAttribute('data-finger')){fingerOK=!fingerOK;setBtn()}
      e.stopPropagation();
    });
    host.querySelector('[data-size]').addEventListener('input',function(e){size=+e.target.value});
    setTool('pen');
    window.addEventListener('resize',resize);
    return{resize:resize,redraw:redraw};
  }

  /* ---------- 탭 ---------- */

  /* ---------- 할 일 공통 ---------- */

  function gDriveSync(){
    if(!gConnected())return;
    if(G.dbusy){G.again=true;return}
    G.dbusy=true;setStatus('gsyncing');
    var fileQ=G.fileId?Promise.resolve({id:G.fileId}):gfetch(DRV+'?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='diary-data.json'")).then(function(r){return r&&r.files&&r.files[0]||null});
    fileQ.then(function(f){
      if(!f){
        var b='diary'+Date.now(),pack=localPack();
        var body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'diary-data.json',parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(pack)+'\r\n--'+b+'--';
        return gfetch(UPL+'?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body}).then(function(x){G.fileId=x.id});
      }
      G.fileId=f.id;
      return gfetch(DRV+'/'+f.id+'?alt=media').then(function(r){
        if(r&&typeof r==='object'&&gMerge(r))return gfetch(UPL+'/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:JSON.stringify(localPack())});
      },function(e){if(e&&e.code===404){G.fileId=null}throw e});
    }).then(function(){G.lastSync=Date.now();G.lastErr='';setStatus('gsynced');if(S.tab==='set')renderSet()},gFail).then(function(){
      G.dbusy=false;if(G.again){G.again=false;gScheduleDrive()}
    });
  }
  function gScheduleDrive(){if(!gConnected())return;clearTimeout(G.dt);G.dt=setTimeout(gDriveSync,2500)}
  function gSyncAll(force){if(!gConnected()){gAuth();return}gLoadCals().then(function(){gRefreshCalendars();gDriveSync()},gFail)}
  function gStart(){
    if(gConnected()){
      setStatus('gsyncing');
      gLoadCals().then(function(){gRefreshCalendars();gDriveSync()},gFail);
    }else if(settings.google&&navigator.onLine!==false&&Date.now()-load('gauto',0)>60000){
      setStatus('gexpired');gAuth();return;
    }else setStatus(settings.google?'gexpired':'gnone');
    document.addEventListener('visibilitychange',function(){
      if(document.hidden||!gConnected())return;
      gDriveSync();var d=pd(S.sel);gEnsureMonth(S.ym.y,S.ym.m);gEnsureMonth(d.getFullYear(),d.getMonth());
    });
    setInterval(function(){if(!document.hidden&&gConnected())gDriveSync()},90000);
    setInterval(function(){if(settings.google&&G.token&&!gConnected()&&SYNC.status!=='gexpired')setStatus('gexpired')},30000);
  }
  function gSettingsHTML(){
    var on=gConnected(),h='';
    if(!settings.google&&!on){
      h='<div class="sgrp"><h3>구글 계정</h3><div class="opt"><div><b>연결 안 됨</b><span>연결하면 구글 캘린더 일정이 보이고, 할 일·메모·손글씨·기록이 구글 드라이브를 통해 아이폰·아이패드·노트북에서 맞춰집니다.</span></div><button type="button" class="btn" data-gconnect>구글 연결</button></div>'+
        '<p class="muted" style="margin:6px 0">처음 연결할 때 "Google에서 확인하지 않은 앱" 경고가 나오면 <b>고급 → 나의 다이어리(으)로 이동</b>을 누르고, 권한을 모두 체크해 허용하세요. 직접 만든 개인용 앱이라 나오는 안내입니다.</p></div>';
    }else{
      h='<div class="sgrp"><h3>구글 계정</h3><div class="opt"><div><b>'+(on?'연결됨':'연결 갱신 필요')+'</b><span>'+esc(G.email||'')+'</span></div>'+(on?'<button type="button" class="pill" data-gdisconnect>연결 해제</button>':'<button type="button" class="btn" data-gconnect>다시 연결</button>')+'</div>'+
        '<div class="opt"><div><b id="syncLine">'+statusText()+'</b><span>'+(G.lastSync?'마지막 동기화 '+new Date(G.lastSync).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'')+(G.lastErr?' · '+esc(G.lastErr):'')+'</span></div><button type="button" class="pill" data-gsync>지금 동기화</button></div>'+
        '<p class="muted" style="margin:6px 0">구글 보안 정책상 로그인은 약 1시간 유지됩니다. 만료되면 앱을 다시 열 때 자동으로 갱신되고, 위쪽 상태 표시를 눌러도 갱신됩니다.</p></div>';
      if(G.cals.length){
        h+='<div class="sgrp"><h3>표시할 구글 캘린더</h3>'+G.cals.map(function(c){var shown=!settings.gcalShow||settings.gcalShow[c.id]!==false;
          return '<div class="opt"><div style="flex-direction:row;align-items:center;gap:10px"><i style="width:12px;height:12px;border-radius:4px;background:'+c.bg+';flex:none"></i><b>'+esc(c.name)+(c.primary?' (기본)':'')+'</b></div><button type="button" class="sw2" role="switch" data-gcal="'+esc(c.id)+'" aria-checked="'+shown+'" aria-label="'+esc(c.name)+' 표시"></button></div>'}).join('')+
          '<p class="muted" style="margin:6px 0">앱에서 추가한 일정은 기본 캘린더에 저장되어 아이폰 캘린더 앱에도 보입니다.</p></div>';
      }
      h+='<div class="sgrp"><h3>동기화되는 것</h3><div class="opt"><div><b>구글 캘린더</b><span>일정 보기 · 추가 · 삭제</span></div></div><div class="opt"><div><b>구글 드라이브 (앱 전용 폴더)</b><span>할 일 · 메모 · 손글씨 · 실행 기록 · 회고. 드라이브 목록에는 보이지 않는 숨김 저장 공간입니다</span></div></div><div class="opt"><div><b>Google Tasks</b><span>다음 업데이트에서 연결 예정</span></div></div></div>';
    }
    return h;
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||b.disabled)return;var d=b.dataset,t;
    if(d.tab){setTab(d.tab,S.tab===d.tab);return}
    if(d.date){S.sel=d.date;var dd=pd(d.date);if(dd.getMonth()!==S.ym.m)S.ym={y:dd.getFullYear(),m:dd.getMonth()};S.detail.cal=true;$('evForm').classList.add('hide');renderCal();if(!wide())window.scrollTo(0,0);return}
    if(d.back){S.detail[d.back]=false;render();return}
    if(d.toggle){var p=d.toggle.split('|');t=byId(p[0]);if(t){if(t.repeat){t.doneOn=t.doneOn||{};if(t.doneOn[p[1]])delete t.doneOn[p[1]];else t.doneOn[p[1]]=true}else t.done=!t.done;saveTodos();render()}return}
    if(d.star){t=byId(d.star);if(t){t.star=!t.star;saveTodos();render()}return}
    if(d.del){S.todos=S.todos.filter(function(x){return x.id!=d.del});saveTodos();render();return}
    if(d.delev!==undefined){var arr=evOf(S.sel),rm=arr[+d.delev],key=S.sel+':'+d.delev;if(!rm)return;
      if(!(S.delArm&&S.delArm.k===key&&Date.now()-S.delArm.t<4000)){S.delArm={k:key,t:Date.now()};renderCal();return}
      S.delArm=null;
      if(rm.src==='local'){S.userEv[S.sel].splice(rm.i,1);if(!S.userEv[S.sel].length)delete S.userEv[S.sel];save('userEv',S.userEv);renderCal()}
      else gDeleteEvent(rm);
      return}
    if(b.hasAttribute('data-gconnect')){gAuth();return}
    if(b.hasAttribute('data-gsync')){gSyncAll(true);return}
    if(b.hasAttribute('data-gdisconnect')){gDisconnect();return}
    if(d.gcal){settings.gcalShow=settings.gcalShow||{};settings.gcalShow[d.gcal]=settings.gcalShow[d.gcal]===false;save('settings',settings);b.setAttribute('aria-checked',settings.gcalShow[d.gcal]!==false);G.fetched={};gRefreshCalendars();return}
    if(d.filter){S.filter=d.filter;renderTodo();return}
    if(d.memo){S.cur=+d.memo;S.detail.memo=true;renderMemo();if(!wide())window.scrollTo(0,0);return}
    if(d.memomode){var m=curMemo();if(m){m.mode=d.memomode;saveMemos();renderMemo()}return}
    if(d.recday){S.sel=d.recday;renderRec();return}
    if(d.hour){var l=S.doLog[S.sel]=S.doLog[S.sel]||{};if(l[d.hour])delete l[d.hour];else l[d.hour]='기록함';save('doLog',S.doLog);renderRec();return}
    if(d.seemode){S.seeMode=d.seemode;save('seeMode',S.seeMode);renderRec();return}
    if(d.setsel){S.setSel=d.setsel;S.detail.set=true;renderSet();return}
    if(d.set){settings[d.set]=!settings[d.set];save('settings',settings);b.setAttribute('aria-checked',settings[d.set]);return}
    if(b.hasAttribute('data-gorec')){setTab('rec');return}
    if(b.id==='prevM'||b.id==='nextM'){var nm=new Date(S.ym.y,S.ym.m+(b.id==='prevM'?-1:1),1);S.ym={y:nm.getFullYear(),m:nm.getMonth()};renderCal();return}
    if(b.id==='prevW'||b.id==='nextW'){S.sel=addDays(S.sel,b.id==='prevW'?-7:7);renderRec();return}
    if(b.id==='goToday'){goToday();S.detail.cal=wide();renderCal();return}
    if(b.id==='fab'){
      if(S.tab==='cal'){S.detail.cal=true;renderCal();$('evForm').classList.remove('hide');$('evT').focus();return}
      if(S.tab==='todo'){$('todoAdd').focus();return}
      if(S.tab==='memo'){var id=Date.now();S.memos.push({id:id,title:'',text:'',strokes:[],mode:'type',updated:id});S.cur=id;S.detail.memo=true;saveMemos();renderMemo();$('mtitle').focus();return}
    }
    if(b.id==='delMemo'){var did=S.cur;S.memos=S.memos.filter(function(x){return x.id!==did});S.cur=null;S.detail.memo=false;rawSave('memos',S.memos);dirty('memo:'+did);renderMemo();return}
    if(b.id==='carry'){var tm=addDays(TODAY,1),left=S.todos.filter(function(x){return !x.repeat&&x.date&&x.date<=TODAY&&!x.done});left.forEach(function(x){x.date=tm});saveTodos();renderTodo();
      $('msg').textContent=left.length?'미완료 '+left.length+'건을 내일로 옮겼어요':'넘길 할 일이 없어요';$('msg').classList.remove('hide');return}
    if(b.hasAttribute('data-syncnow')){syncAll();return}
    if(b.hasAttribute('data-export')){exportFile();return}
    if(d.restorebk){restoreFromCloud(d.restorebk);return}
    if(b.hasAttribute('data-restore-ok')){if(SYNC.pending){restoreAll(SYNC.pending);SYNC.pending=null;bkMsg('복원했습니다.')}return}
    if(b.hasAttribute('data-restore-cancel')){SYNC.pending=null;bkMsg('');$('restoreBox').classList.add('hide');return}
  });
  document.querySelectorAll('form[data-add]').forEach(function(f){f.addEventListener('submit',function(e){
    e.preventDefault();var inp=f.querySelector('input'),v=inp.value.trim();if(!v)return;
    var item={id:S.nextId++,text:v,done:false,star:false};
    if(f.dataset.add==='day')item.date=S.sel;
    else if($('todoRep').value==='daily'){item.repeat='daily';item.from=TODAY}
    else item.date=S.filter==='tomorrow'?addDays(TODAY,1):TODAY;
    S.todos.push(item);inp.value='';saveTodos();render();});});
  $('evForm').addEventListener('submit',function(e){
    e.preventDefault();var ti=$('evT').value.trim();if(!ti)return;
    function tv(s){var p=s.split(':');return +p[0]+(+p[1]||0)/60}
    var s=tv($('evS').value||'10:00'),en=tv($('evE').value||'11:00');if(en<=s)en=s+1;
    if(gConnected()){gCreateEvent(S.sel,$('evS').value||'10:00',$('evE').value||'11:00',ti,$('evC').value||'work');$('evT').value='';$('evForm').classList.add('hide');return}
    (S.userEv[S.sel]=S.userEv[S.sel]||[]).push([s,en,ti,$('evC').value||'work']);save('userEv',S.userEv);
    $('evT').value='';$('evForm').classList.add('hide');renderCal();});
  document.querySelectorAll('[data-see]').forEach(function(t){t.addEventListener('input',function(){
    var v=S.see[S.sel]=S.see[S.sel]||{};v[t.dataset.see]=t.value;save('see',S.see)})});
  window.addEventListener('resize',function(){if(S.tab==='memo')renderMemoList()});
  document.addEventListener('click',function(e){var c=e.target.closest('.syncchip');if(c&&SYNC.status==='gexpired')gAuth()});
  // 자정이 지나거나 앱으로 돌아오면 오늘 날짜 갱신
  function checkDay(){var n=ds(new Date());if(n!==TODAY){var wasToday=S.sel===TODAY;TODAY=n;if(wasToday)goToday();render()}}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)checkDay()});
  setInterval(checkDay,60000);

  S.detail.cal=wide();
  var gRet=gInit();
  if(gRet&&gRet.tab){if(gRet.setSel)S.setSel=gRet.setSel;if(gRet.tab==='set')S.detail.set=true;setTab(gRet.tab)}else setTab(settings.startTab||'cal');
  if(G_OK){gStart()}else{setStatus('connecting');startSync()}
  if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){
    try{navigator.serviceWorker.register('./sw.js').catch(function(){})}catch(e){}
  }
})();
</script>
